[tool.poetry]
name = "nvidia-ai-studio-backend"
version = "0.1.0"
description = "Backend for EVILCLOWN AI"
authors = ["Kartik Verma <kartik@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
httpx = "^0.27.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.vercel]
entrypoint = "backend/app/main.py:app"
